name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Self-contained git-install build (no sibling harness checkout): proves
      # `dsh plugin add github:…` can transpile src → lib on a consumer machine.
      - run: pnpm run prepare
      - run: pnpm run test
