# @tradercjz/dsh-dolphindb bundle patch: the DolphinDB integration over dsh-base.
# All three rows are NEW (insert); no base row is overridden.
#
# Connection credentials stay out of the bundle: `passwordRef` names the
# environment variable the run-time credential provider resolves, and
# host/port/username fall back to the executor's localhost defaults. A remote
# server overrides them in the profile's own cordis.patch.yml (see README).

- insert:
    # The local WebSocket executor. Ships a single `local` server
    # (127.0.0.1:8848, credential ref DOLPHINDB_PASSWORD) as the deployment
    # default. Add servers and switch `active` in the `dolphindb` settings
    # section (web Settings → Plugins, or $DSH_HOME/settings.yaml); a profile
    # patch may also override this row's whole config.
    - id: dolphindb
      name: '@tradercjz/dsh-dolphindb/executor'
      config:
        active: local
        servers:
          local:
            passwordRef: DOLPHINDB_PASSWORD

    # The model-facing query (read-only) and execute (write, approval-gated)
    # tools, plus dolphindb_switch for changing the active server.
    - id: tool-dolphindb
      name: '@tradercjz/dsh-dolphindb/tool'

    # The web settings card (server registry + active switching + per-server
    # credentials) under Settings → Plugins → Plugin configuration.
    - id: ui-dolphindb
      name: '@tradercjz/dsh-client-dolphindb'

    # This bundle's runtime glue: registers the bundled DolphinDB skill
    # provider (the shipped SKILL.md tree) on the host `skills` registry.
    - id: dolphin-skills
      name: '@tradercjz/dsh-dolphindb'
